 <marker id="mint-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 10 6 1 11" fill="none" stroke="#84e6cd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#18334b" stroke-width="1"/></pattern>
</defs>
