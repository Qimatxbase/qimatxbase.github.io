<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040" role="img" aria-labelledby="video-title video-desc">
<title id="video-title">Video Event Search &amp; Automated Evaluation</title><desc id="video-desc">Ingestion: uploaded local video is chunked with FFmpeg and embedded with Gemini into one ChromaDB dense index. Query: question and history go through Google-hosted Gemma rewrite and Gemini query embedding, then Chroma top-five retrieval and Gemini 2.5 Flash answer generation. A separate personal evaluation lane builds annotation-based questions with Ollama and records judged metrics and CSV reports; annotations do not enter normal inference.</desc>
